<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ITWS :: Tickets</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/assets/css/main.css" rel="stylesheet">
</head>

<body data-bs-theme="dark">
    <div class="container">
        <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="./index.html">
                    <i class="fa-solid fa-plane-departure"></i> ITWS 2025
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/airlines.html">Airlines</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./types.html">Types</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/tickets.html">Tickets</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <h3>Tickets</h3>
        <a href="/new/ticket.html" class="btn btn-sm btn-primary">+ Add Ticket</a>
        <table class="table table-striped table-hover mt-3">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Destination</th>
                    <th scope="col">Flight Number</th>
                    <th scope="col">Scheduled At</th>
                    <th scope="col">Airline</th>
                    <th scope="col">Ticket Type</th>
                    <th scope="col">Price</th>
                    <th scope="col">Count</th>
                    <th scope="col">Total</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody id="table">
            </tbody>
        </table>
        <footer class="text-center" id="footer"></footer>
    </div>
    <template id="template">
        <tr>
            <th scope="row" class="id"></th>
            <td class="dest"></td>
            <td class="num"></td>
            <td class="sch"></td>
            <td class="airline"></td>
            <td class="type"></td>
            <td class="price"></td>
            <td class="count"></td>
            <td class="total"></td>
            <td>
                <div class="btn-group">
                    <button type="button" class="btn btn-sm btn-success edit" title="Edit">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-danger remove" title="Remove">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </td>
        </tr>
    </template>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/global.js"></script>
    <script>
        const table = document.getElementById('table')
        const template = document.getElementById('template')

        if (table && template) {
            showLoadingAnimation('We are retrieving the ticket list for you.')
            client.get('/ticket')
                .then(rsp => {
                    rsp.data.forEach(ticket => {
                        const copy = template.content.cloneNode(true)
                        copy.querySelector('.id').innerText = ticket.id
                        copy.querySelector('.dest').innerText = ticket.flight.destination
                        copy.querySelector('.num').innerText = ticket.flight.flightNumber
                        copy.querySelector('.sch').innerText = formatDate(ticket.flight.estimatedAt ?? ticket.flight.scheduledAt)
                        copy.querySelector('.airline').innerText = ticket.airline.name
                        copy.querySelector('.type').innerText = ticket.type.name
                        copy.querySelector('.price').innerText = ticket.price
                        copy.querySelector('.count').innerText = ticket.count
                        copy.querySelector('.total').innerText = ticket.price * ticket.count
                        // copy.querySelector('.edit').addEventListener('click', (e) => {
                        //     window.location.href = '/edit/type.html?id=' + type.id
                        // })
                        // copy.querySelector('.remove').addEventListener('click', (e) => {
                        //     if (confirm('Are you sure?')) {
                        //         client.request({
                        //             url: `/type/${type.id}`,
                        //             method: 'delete'
                        //         })
                        //             .then(rsp => window.location.reload())
                        //             .catch(e => showErrorAlert(`${e.code}: ${e.message}`))
                        //     }
                        // })
                        table.appendChild(copy)
                    })
                    Swal.close()
                })
                .catch(e => showErrorAlert(`${e.code}: ${e.message}`))
        }
    </script>
</body>

</html>
