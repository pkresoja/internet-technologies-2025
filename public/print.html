<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ITWS :: Print Ticket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Opens the ticket in a better printable view">
    <link rel="icon" type="image/png" href="/assets/img/icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/assets/css/main.css" rel="stylesheet">
</head>

<body data-bs-theme="dark">
    <div class="container">
        <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="/index.html">
                    <i class="fa-solid fa-plane-departure"></i> ITWS 2025
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/index.html">
                                <i class="fa-solid fa-house"></i> Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/airlines.html">
                                <i class="fa-solid fa-plane"></i> Airlines
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/types.html">
                                <i class="fa-solid fa-person-walking-luggage"></i> Types
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/tickets.html">
                                <i class="fa-solid fa-ticket"></i> Tickets
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="ticket" hidden>
            <div class="mx-auto text-center mb-3">
                <img id="qrcode" alt="Ticket QR Code">
            </div>
            <div class="card mb-3">
                <div class="card-body">
                    <table class="table table-hover">
                        <tbody>
                            <tr>
                                <th scope="row">Destination:</th>
                                <td id="dest"></td>
                            </tr>
                            <tr>
                                <th scope="row">Scheduled At:</th>
                                <td id="sch"></td>
                            </tr>
                            <tr>
                                <th scope="row">Booked At</th>
                                <td id="time"></td>
                            </tr>
                            <tr>
                                <th scope="row">Airline:</th>
                                <td id="airline"></td>
                            </tr>
                            <tr>
                                <th scope="row">Airplane:</th>
                                <td id="airplane"></td>
                            </tr>
                            <tr>
                                <th scope="row">Gate:</th>
                                <td id="gate"></td>
                            </tr>
                            <tr>
                                <th scope="row">Type:</th>
                                <td id="type"></td>
                            </tr>
                            <tr>
                                <th scope="row">Count:</th>
                                <td id="count"></td>
                            </tr>
                            <tr>
                                <th scope="row">Price:</th>
                                <td>
                                    <span id="price"></span> EUR
                                </td>
                            </tr>
                            <tr>
                                <th scope="row">Total:</th>
                                <td>
                                    <span id="total"></span> EUR
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="/assets/js/global.js"></script>
        <script>
            const params = new URLSearchParams(location.search)
            const card = document.querySelector('.ticket')

            if (params.get('id') && card)
                loadData(params.get('id'))

            async function loadData(id) {
                try {
                    showLoadingAnimation('We are retrieving ticket information.')
                    const rsp = await client.get('/ticket/' + id)

                    const img = document.getElementById('qrcode')
                    const qrData = `${rsp.data.id} ${rsp.data.flight.flightKey}`
                    img.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${qrData}`

                    document.getElementById('dest').innerText = rsp.data.flight.destination
                    document.getElementById('sch').innerText =
                        formatDate(rsp.data.flight.estimatedAt ?? rsp.data.flight.scheduledAt)
                    document.getElementById('time').innerText = 
                    formatDate(rsp.data.updatedAt ?? rsp.data.createdAt)
                    document.getElementById('airline').innerText = rsp.data.airline.name
                    document.getElementById('airplane').innerText = rsp.data.flight.plane
                    document.getElementById('gate').innerText = rsp.data.flight.gate ?? 'N/A'
                    document.getElementById('type').innerText = rsp.data.type.name
                    document.getElementById('count').innerText = rsp.data.count
                    document.getElementById('price').innerText = rsp.data.price
                    document.getElementById('total').innerText = rsp.data.price * rsp.data.count

                    // Show card now
                    card.hidden = false
                    Swal.close()
                } catch (e) {
                    console.error(e)
                    showErrorAlert(`${e.code}: ${e.message}`)
                }
            }
        </script>
</body>

</html>
